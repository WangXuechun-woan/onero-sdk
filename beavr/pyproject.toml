[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beavr-onero"
version = "0.1.0"
description = "BEAVR-Bot adapter for Onero A1 robotic arm"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "onero-sdk",
    "numpy>=1.24",
    "pyzmq>=25.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
beavr-onero = "beavr_onero.run:main"

[tool.setuptools.packages.find]
include = ["beavr_onero*"]
