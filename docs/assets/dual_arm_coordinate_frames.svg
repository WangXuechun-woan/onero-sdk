<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .soft { fill: #eef6ff; stroke: #7dd3fc; stroke-width: 1.2; }
      .hint { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .title { font: 700 30px "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .h2 { font: 700 19px "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .txt { font: 15px "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .small { font: 13px "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .tiny { font: 12px "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .mono { font: 14px "Noto Sans Mono CJK SC", Consolas, monospace; fill: #0f172a; }
      .monoSmall { font: 13px "Noto Sans Mono CJK SC", Consolas, monospace; fill: #0f172a; }
      .x { stroke: #dc2626; fill: #dc2626; }
      .y { stroke: #16a34a; fill: #16a34a; }
      .z { stroke: #2563eb; fill: #2563eb; }
      .axis { stroke-width: 4; stroke-linecap: round; }
      .thin { stroke-width: 2.4; stroke-linecap: round; fill: none; }
      .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
      .armL { stroke: #0f766e; stroke-width: 11; stroke-linecap: round; fill: none; }
      .armR { stroke: #7c3aed; stroke-width: 11; stroke-linecap: round; fill: none; }
      .joint { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .tableLine { stroke: #e2e8f0; stroke-width: 1; }
      .tableHead { fill: #f1f5f9; }
      .labelBoxL { fill: #e6fffb; stroke: #14b8a6; stroke-width: 1.2; }
      .labelBoxR { fill: #f4efff; stroke: #8b5cf6; stroke-width: 1.2; }
      .callout { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.2; }
    </style>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1060"/>
  <text class="title" x="48" y="54">Onero A1 双臂坐标系与关节正方向</text>
  <text class="subtitle" x="48" y="82">世界坐标系：X 前、Y 左、Z 上；关节正方向：URDF joint axis + 右手定则。</text>

  <!-- World frame panel -->
  <rect class="panel" x="48" y="110" width="340" height="280" rx="8"/>
  <text class="h2" x="72" y="145">1. 世界坐标系 World</text>
  <text class="small" x="72" y="171">俯视图：纸面上方是前，纸面左侧是左</text>
  <line class="axis x" x1="214" y1="315" x2="214" y2="210" marker-end="url(#arrow-red)"/>
  <line class="axis y" x1="214" y1="315" x2="110" y2="315" marker-end="url(#arrow-green)"/>
  <circle class="z" cx="214" cy="315" r="13"/>
  <circle fill="#ffffff" cx="214" cy="315" r="5"/>
  <text class="txt" x="226" y="214" fill="#dc2626">+X 前方</text>
  <text class="txt" x="82" y="305" fill="#16a34a">+Y 左方</text>
  <text class="txt" x="232" y="343" fill="#2563eb">+Z 上方</text>
  <text class="tiny" x="72" y="372">蓝色圆点表示 +Z 垂直纸面向外，也就是向上。</text>

  <!-- Dual arm layout -->
  <rect class="panel" x="420" y="110" width="930" height="560" rx="8"/>
  <text class="h2" x="444" y="145">2. 推荐双臂安装命名</text>
  <text class="small" x="444" y="171">左臂位于纸面左侧（世界 +Y）；右臂位于纸面右侧（世界 -Y）。图中为俯视示意。</text>

  <!-- World axes in layout -->
  <line class="thin x" x1="1230" y1="395" x2="1230" y2="285" marker-end="url(#arrow-red)"/>
  <line class="thin y" x1="1230" y1="395" x2="1110" y2="395" marker-end="url(#arrow-green)"/>
  <text class="small" x="1242" y="292" fill="#dc2626">世界 +X 前</text>
  <text class="small" x="1110" y="382" fill="#16a34a">世界 +Y 左</text>

  <!-- Torso / fixture: rotated with the top-view frame, front is upward -->
  <rect x="725" y="476" width="230" height="64" fill="#e2e8f0" stroke="#64748b" stroke-width="2" rx="8"/>
  <line x1="610" y1="372" x2="610" y2="520" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <line x1="1068" y1="372" x2="1068" y2="520" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <line x1="840" y1="476" x2="840" y2="332" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <text class="tiny" x="858" y="362">前</text>
  <text class="tiny" x="804" y="506">躯干 / 固定支架</text>

  <!-- Left arm base and schematic arm -->
  <circle class="joint" cx="640" cy="445" r="18"/>
  <path class="armL" d="M640 445 C580 365, 608 280, 700 240 S850 215, 820 305"/>
  <circle class="joint" cx="615" cy="338" r="12"/>
  <circle class="joint" cx="730" cy="238" r="12"/>
  <circle class="joint" cx="820" cy="305" r="12"/>

  <rect class="labelBoxL" x="455" y="545" width="214" height="86" rx="7"/>
  <text class="mono" x="472" y="571">左臂 A1L</text>
  <text class="small" x="472" y="594">side_mount_left</text>
  <text class="small" x="472" y="616">+Yb 向下，重力为 +Yb</text>
  <line class="guide" x1="620" y1="545" x2="640" y2="445"/>

  <line class="thin x" x1="640" y1="445" x2="640" y2="350" marker-end="url(#arrow-red)"/>
  <line class="thin z" x1="640" y1="445" x2="558" y2="445" marker-end="url(#arrow-blue)"/>
  <text class="small" x="652" y="356" fill="#dc2626">+Xb 前</text>
  <text class="small" x="505" y="436" fill="#2563eb">+Zb 朝外侧左</text>

  <!-- Right arm base and schematic arm -->
  <circle class="joint" cx="1038" cy="445" r="18"/>
  <path class="armR" d="M1038 445 C1098 365, 1070 280, 978 240 S828 215, 858 305"/>
  <circle class="joint" cx="1063" cy="338" r="12"/>
  <circle class="joint" cx="948" cy="238" r="12"/>
  <circle class="joint" cx="858" cy="305" r="12"/>

  <rect class="labelBoxR" x="1084" y="545" width="214" height="86" rx="7"/>
  <text class="mono" x="1101" y="571">右臂 A1R</text>
  <text class="small" x="1101" y="594">side_mount_right</text>
  <text class="small" x="1101" y="616">+Yb 向上，重力为 -Yb</text>
  <line class="guide" x1="1084" y1="545" x2="1038" y2="445"/>

  <line class="thin x" x1="1038" y1="445" x2="1038" y2="350" marker-end="url(#arrow-red)"/>
  <line class="thin z" x1="1038" y1="445" x2="1120" y2="445" marker-end="url(#arrow-blue)"/>
  <text class="small" x="966" y="356" fill="#dc2626">+Xb 前</text>
  <text class="small" x="1128" y="436" fill="#2563eb">+Zb 朝外侧右</text>

  <!-- Mirror rule, placed away from arm geometry -->
  <rect class="callout" x="710" y="555" width="335" height="86" rx="8"/>
  <text class="h2" x="732" y="584">双臂对称姿态规则</text>
  <text class="mono" x="732" y="610">q_left = -q_right</text>
  <text class="small" x="732" y="630">先定义右臂，再对左臂逐元素取反。</text>

  <!-- Joint sign rule -->
  <rect class="panel" x="48" y="700" width="408" height="330" rx="8"/>
  <text class="h2" x="72" y="735">3. 正负号怎么判断</text>
  <text class="txt" x="72" y="770">1. 先确认模型：A1L 还是 A1R</text>
  <text class="txt" x="72" y="800">2. 查右侧表格中的该关节正轴</text>
  <text class="txt" x="72" y="830">3. 拇指沿正轴，四指弯曲方向为正转</text>
  <text class="txt" x="72" y="860">4. 做双臂镜像动作时可用 q_left = -q_right</text>
  <rect class="hint" x="72" y="882" width="342" height="24" rx="5"/>
  <text class="tiny" x="86" y="899">不要用“向内/向外”单独定义正负号；它依赖观察视角。</text>

  <!-- Joint axis table -->
  <rect class="panel" x="484" y="700" width="866" height="330" rx="8"/>
  <text class="h2" x="508" y="735">4. 零位时各关节正轴（表达在各自 base frame 中）</text>
  <text class="small" x="508" y="760">正角度 = 绕该正轴按右手定则旋转。沿 +轴方向看，逆时针为正。</text>

  <rect class="tableHead" x="508" y="778" width="818" height="30" rx="4"/>
  <text class="monoSmall" x="524" y="798">关节</text>
  <text class="monoSmall" x="620" y="798">A1L 正轴</text>
  <text class="monoSmall" x="790" y="798">A1R 正轴</text>
  <text class="monoSmall" x="960" y="798">说明</text>

  <line class="tableLine" x1="508" y1="818" x2="1326" y2="818"/>
  <text class="monoSmall" x="524" y="837">J1</text><text class="monoSmall" x="620" y="837">+Zb</text><text class="monoSmall" x="790" y="837">+Zb</text><text class="small" x="960" y="837">基座 yaw / 肩部摆动</text>
  <line class="tableLine" x1="508" y1="848" x2="1326" y2="848"/>
  <text class="monoSmall" x="524" y="867">J2</text><text class="monoSmall" x="620" y="867">-Yb</text><text class="monoSmall" x="790" y="867">-Yb</text><text class="small" x="960" y="867">肩部抬升/展开</text>
  <line class="tableLine" x1="508" y1="878" x2="1326" y2="878"/>
  <text class="monoSmall" x="524" y="897">J3</text><text class="monoSmall" x="620" y="897">+Xb</text><text class="monoSmall" x="790" y="897">-Xb</text><text class="small" x="960" y="897">左右镜像，同动作常用相反符号</text>
  <line class="tableLine" x1="508" y1="908" x2="1326" y2="908"/>
  <text class="monoSmall" x="524" y="927">J4</text><text class="monoSmall" x="620" y="927">+Zb</text><text class="monoSmall" x="790" y="927">+Zb</text><text class="small" x="960" y="927">肘/腕链旋转轴</text>
  <line class="tableLine" x1="508" y1="938" x2="1326" y2="938"/>
  <text class="monoSmall" x="524" y="957">J5</text><text class="monoSmall" x="620" y="957">+Xb</text><text class="monoSmall" x="790" y="957">-Xb</text><text class="small" x="960" y="957">左右镜像，腕部摆动轴</text>
  <line class="tableLine" x1="508" y1="968" x2="1326" y2="968"/>
  <text class="monoSmall" x="524" y="987">J6</text><text class="monoSmall" x="620" y="987">-Zb</text><text class="monoSmall" x="790" y="987">-Zb</text><text class="small" x="960" y="987">腕部旋转轴</text>
  <line class="tableLine" x1="508" y1="998" x2="1326" y2="998"/>
  <text class="monoSmall" x="524" y="1017">J7</text><text class="monoSmall" x="620" y="1017">+Xb</text><text class="monoSmall" x="790" y="1017">-Xb</text><text class="small" x="960" y="1017">左右镜像，末端轴</text>
</svg>
