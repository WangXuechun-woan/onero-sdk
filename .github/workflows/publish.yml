name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Tag must be {expected}, got {os.environ["RELEASE_TAG"]}')
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check distributions contain no GIFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          for path in Path('dist').iterdir():
              if path.suffix == '.whl':
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
              elif path.name.endswith('.tar.gz'):
                  with tarfile.open(path) as archive:
                      names = archive.getnames()
              else:
                  raise SystemExit(f'Unexpected artifact: {path}')
              gifs = [name for name in names if name.lower().endswith('.gif')]
              if gifs:
                  raise SystemExit(f'{path} contains GIFs: {gifs}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/onero-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
